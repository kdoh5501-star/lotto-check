<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>백만장자 로또 당첨확인</title>
<style>
  body { margin:0; background:#f4f5f7; color:#111; font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; font-size:19px; }
  .wrap { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:24px; margin:8px 0 16px; text-align:center; }
  .box { background:#fff; border:1px solid #ddd; border-radius:12px; padding:16px; margin-bottom:14px; }
  .box h2 { font-size:18px; margin:0 0 10px; }
  .pick { display:flex; align-items:center; gap:8px; }
  .pick label { font-weight:bold; white-space:nowrap; }
  .pick select { flex:1; min-width:0; font-size:19px; padding:10px; border-radius:8px; border:2px solid #2563eb; background:#fff; font-weight:bold; }
  .nav { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .nav button { font-size:18px; padding:10px 14px; border-radius:8px; border:1px solid #bbb; background:#fff; }
  .nav button:disabled { opacity:.3; }
  .ep { text-align:center; font-weight:bold; font-size:21px; }
  .ep small { display:block; font-weight:normal; font-size:15px; color:#666; }
  .balls { text-align:center; margin-top:12px; }
  .ball { display:inline-flex; width:34px; height:34px; border-radius:50%; align-items:center; justify-content:center; font-size:15px; font-weight:bold; color:#fff; margin:2px; }
  .balls .ball { width:44px; height:44px; font-size:19px; }
  .y{background:#f2b720}.b{background:#4a90d9}.r{background:#e0534f}.g{background:#8a8f98}.gr{background:#3fae5b}
  .ball.dim { background:#eceef1; color:#999; }
  .ball.bon { box-shadow:0 0 0 3px #f59e0b; }
  .big { text-align:center; font-size:24px; font-weight:bold; padding:20px 10px; border-radius:12px; margin-bottom:14px; }
  .big.win { background:#dcfce7; color:#166534; border:2px solid #22c55e; }
  .big.lose { background:#fff; color:#444; border:1px solid #ddd; }
  .big small { display:block; font-size:16px; font-weight:normal; margin-top:6px; }
  .ranks { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; text-align:center; }
  .ranks div { border:1px solid #ddd; border-radius:8px; padding:8px 2px; font-size:15px; }
  .ranks b { display:block; font-size:22px; }
  .ranks .on { background:#dcfce7; border-color:#22c55e; color:#166534; }
  table { width:100%; border-collapse:collapse; font-size:16px; }
  td, th { border-bottom:1px solid #eee; padding:8px 4px; text-align:center; }
  th { color:#666; font-weight:normal; font-size:14px; white-space:nowrap; }
  tr.me td { background:#eff6ff; font-weight:bold; }
  tr.click { cursor:pointer; }
  .more { width:100%; font-size:17px; padding:12px; margin-top:10px; border-radius:8px; border:1px solid #bbb; background:#fff; }
  .msg { text-align:center; color:#666; font-size:16px; }
  .err { color:#b91c1c; }
  .w { color:#166534; font-weight:bold; }
  .manual input { width:46px; font-size:20px; padding:6px 0; text-align:center; margin:2px; }
  .manual button { font-size:18px; padding:8px 16px; margin-top:8px; }
  .news { width:100%; font-size:18px; padding:12px; margin-top:12px; border-radius:8px; border:0; background:#fef3c7; color:#92400e; font-weight:bold; }
  .pop { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
  .pop .card { background:#fff; border-radius:16px; padding:22px 18px; width:100%; max-width:440px; max-height:90vh; overflow:auto; text-align:center; }
  .pop h3 { font-size:22px; margin:0 0 4px; }
  .pop .sub { color:#666; font-size:15px; margin-bottom:10px; }
  .pop .line { font-size:20px; margin:10px 0; }
  .pop .top { font-size:22px; font-weight:bold; color:#166534; background:#dcfce7; border-radius:10px; padding:10px; margin:8px 0; }
  .pop .real { background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px; padding:10px; margin:12px 0; font-size:18px; }
  .pop .chips { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin:6px 0 10px; }
  .pop .chips button { font-size:17px; padding:6px 10px; border-radius:999px; border:1px solid #22c55e; background:#f0fdf4; color:#166534; }
  .pop .ok { width:100%; font-size:20px; padding:14px; margin-top:12px; border-radius:10px; border:0; background:#2563eb; color:#fff; font-weight:bold; }
  .foot { text-align:center; color:#888; font-size:13px; margin-top:20px; }
  @media (max-width:480px) {
    body { font-size:17px; } h1 { font-size:20px; } .wrap { padding:12px; }
    .balls .ball { width:36px; height:36px; font-size:16px; margin:1px; }
    .ball { width:27px; height:27px; font-size:12px; margin:1px; }
    td, th { padding:6px 2px; } .nav button { padding:8px 10px; font-size:16px; }
    .pick select { font-size:17px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>💰 백만장자 로또 당첨확인</h1>

  <div class="box pick">
    <label for="jo">우리 조</label>
    <select id="jo"><option>불러오는 중...</option></select>
  </div>

  <div class="box">
    <div class="nav">
      <button id="prev">◀ 이전</button>
      <div class="ep" id="ep">불러오는 중...</div>
      <button id="next">다음 ▶</button>
    </div>
    <div class="balls" id="balls"></div>
    <button class="news" id="newsBtn" style="display:none">📢 이 회차 당첨된 조 보기</button>
  </div>
  <div class="pop" id="pop" style="display:none" onclick="if(event.target===this)closePop()"><div class="card" id="popCard"></div></div>

  <div id="out"><p class="msg">동행복권에서 당첨번호를 가져오고 있어요...</p></div>

  <div class="box" id="allBox" style="display:none">
    <h2>📋 이번 회차 전체 조 한눈에</h2>
    <p class="msg">줄을 누르면 그 조 결과로 바뀌어요.</p>
    <table>
      <thead><tr><th>조</th><th>1등</th><th>2등</th><th>3등</th><th>4등</th><th>5등</th><th>최고</th></tr></thead>
      <tbody id="all"></tbody>
    </table>
  </div>

  <div class="foot">
    당첨번호 출처: 동행복권 (dhlottery.co.kr) · 추첨은 매주 토요일 저녁 8시 35분<br>
    재미로 만든 무료 프로그램이에요. 정확한 당첨 여부는 꼭 동행복권에서 한 번 더 확인하세요.
  </div>
</div>

<script>
// 조합 번호가 처음 적용된 회차 (2026-09-05 추첨, 제1240회)
const FIRST_EP = 1240;
const API = 'https://www.dhlottery.co.kr/lt645/selectPstLt645InfoNew.do?srchDir=center&srchLtEpsd=';
const RANKS = ['1등', '2등', '3등', '4등', '5등'];
const $ = id => document.getElementById(id);

let TEAMS = [];      // [{no, name, games:[{id, nums}]}]
let team = null;     // 지금 보고 있는 조
let draws = {};      // 회차 → {ep, date, win[6], bonus}
let latest = 0, current = 0, manual = null;

// combos.txt 읽기: "== 번호 | 이름" 다음 줄부터 한 줄에 "A게임 | B게임 | C게임"
function parseCombos(text) {
  const teams = [];
  let t = null, line = 0;
  for (const raw of text.split('\n')) {
    const l = raw.trim();
    if (!l || l.startsWith('#')) continue;
    if (l.startsWith('==')) {
      const [no, name] = l.slice(2).split('|').map(s => s.trim());
      t = { no: +no, name: name || '', games: [] }; teams.push(t); line = 0;
      continue;
    }
    line++;
    l.split('|').forEach((g, k) => t.games.push({ id: line + 'ABC'[k], nums: g.trim().split(/\s+/).map(Number) }));
  }
  return teams;
}

function teamLabel(t) { return t.no + '조' + (t.name ? ' · ' + t.name : ''); }

// 지금 시각 기준으로 가장 최근에 추첨했을 회차 (제1회 = 2002-12-07)
function expectedEpisode() {
  const first = Date.UTC(2002, 11, 7, 12, 0);  // 2002-12-07 21:00 KST
  return Math.floor((Date.now() - first) / (7 * 864e5)) + 1;
}

async function load(ep) {
  const res = await fetch(API + ep);
  const json = await res.json();
  for (const d of json.data.list) {
    draws[d.ltEpsd] = {
      ep: d.ltEpsd,
      date: d.ltRflYmd.replace(/(\d{4})(\d\d)(\d\d)/, '$1.$2.$3'),
      win: [d.tm1WnNo, d.tm2WnNo, d.tm3WnNo, d.tm4WnNo, d.tm5WnNo, d.tm6WnNo],
      bonus: d.bnsWnNo,
    };
  }
  return json.data.list.length;
}

// 주소 끝 ?jo=12 → 12조. 없으면 이 기기에서 마지막으로 본 조, 그것도 없으면 1조
function initialTeam() {
  const q = +new URLSearchParams(location.search).get('jo');
  let saved = 0;
  try { saved = +localStorage.getItem('jo'); } catch (e) {}
  return TEAMS.find(t => t.no === q) || TEAMS.find(t => t.no === saved) || TEAMS[0];
}

function selectTeam(no) {
  team = TEAMS.find(t => t.no === no) || TEAMS[0];
  $('jo').value = team.no;
  try { localStorage.setItem('jo', team.no); } catch (e) {}
  history.replaceState(null, '', '?jo=' + team.no);
  if (manual) render(manual.win, manual.bonus, 'manualOut');
  else if (draws[current]) show(current);
}

async function start() {
  try {
    TEAMS = parseCombos(await (await fetch('combos.txt', { cache: 'no-cache' })).text());
  } catch (e) {
    $('out').innerHTML = '<p class="msg err">조합표(combos.txt)를 불러오지 못했어요.</p>';
    return;
  }
  $('jo').innerHTML = TEAMS.map(t => `<option value="${t.no}">${teamLabel(t)}</option>`).join('');
  $('jo').onchange = () => selectTeam(+$('jo').value);
  team = initialTeam();
  $('jo').value = team.no;

  try {
    const ep = expectedEpisode();
    if (!(await load(ep))) await load(ep - 1);   // 결과가 아직 안 올라왔으면 지난주
    latest = Math.max(...Object.keys(draws).map(Number));
    if (!isFinite(latest)) throw new Error('empty');
    await show(latest);
    let seen = 0;
    try { seen = +localStorage.getItem('popupSeen'); } catch (e) {}
    if (seen !== latest) openPop();
  } catch (e) {
    showManual();
  }
}

async function show(ep) {
  current = ep;
  if (!draws[ep]) { try { await load(ep); } catch (e) {} }
  const d = draws[ep];
  $('prev').disabled = ep <= FIRST_EP;
  $('next').disabled = ep >= latest;
  if (!d) { $('ep').textContent = '제' + ep + '회'; $('out').innerHTML = '<p class="msg err">이 회차를 불러오지 못했어요.</p>'; return; }
  $('ep').innerHTML = `제${d.ep}회 <small>${d.date} 추첨${ep === latest ? ' · 최신' : ''}</small>`;
  $('balls').innerHTML = d.win.map(n => ball(n)).join('') + ' <b>+</b> ' + ball(d.bonus);
  render(d.win, d.bonus);
  $('newsBtn').style.display = '';
}

function color(n) { return n <= 10 ? 'y' : n <= 20 ? 'b' : n <= 30 ? 'r' : n <= 40 ? 'g' : 'gr'; }
function ball(n, cls) { return `<span class="ball ${cls || color(n)}">${n}</span>`; }

function check(games, ws, bonus) {
  return games.map(g => {
    const match = g.nums.filter(n => ws.has(n)).length;
    const bonusHit = g.nums.includes(bonus);
    const rank = match === 6 ? 0 : match === 5 && bonusHit ? 1 : match === 5 ? 2 : match === 4 ? 3 : match === 3 ? 4 : -1;
    return { ...g, match, bonusHit, rank };
  });
}

function render(win, bonus, target = 'out') {
  const ws = new Set(win);
  const rows = check(team.games, ws, bonus).sort((a, b) => b.match - a.match || b.bonusHit - a.bonusHit);

  const cnt = [0, 0, 0, 0, 0];
  rows.forEach(r => { if (r.rank >= 0) cnt[r.rank]++; });
  const wins = rows.filter(r => r.rank >= 0).length;
  const best = rows[0].match;

  let html = '';
  if (wins) {
    html += `<div class="big win">🎉 ${team.no}조 축하합니다! ${RANKS[cnt.findIndex(c => c > 0)]} 당첨!<small>${team.games.length}게임 중 ${wins}게임 당첨</small></div>`;
  } else {
    html += `<div class="big lose">${team.no}조는 이번엔 당첨이 없어요<small>가장 많이 맞은 게임: ${best}개</small></div>`;
  }
  html += '<div class="box"><div class="ranks">' +
    RANKS.map((n, i) => `<div class="${cnt[i] ? 'on' : ''}">${n}<b>${cnt[i]}</b></div>`).join('') + '</div></div>';

  html += '<div class="box"><table><tr><th>번호</th><th>우리 번호</th><th>맞음</th><th>결과</th></tr>';
  html += rowsHtml(rows.filter(r => r.match >= 3), ws, bonus);
  html += '<tbody id="rest" style="display:none">' + rowsHtml(rows.filter(r => r.match < 3), ws, bonus) + '</tbody>';
  html += '</table>';
  if (!rows.some(r => r.match >= 3)) html += '<p class="msg">3개 이상 맞은 게임이 없어요.</p>';
  html += `<button class="more" onclick="document.getElementById('rest').style.display='';this.remove()">나머지 게임도 모두 보기</button></div>`;
  $(target).innerHTML = html;

  renderAll(ws, bonus);
}

function rowsHtml(list, ws, bonus) {
  return list.map(r => `<tr><td>${r.id}</td><td>` +
    r.nums.map(n => ws.has(n) ? ball(n) : n === bonus ? ball(n, color(n) + ' bon') : ball(n, 'dim')).join('') +
    `</td><td><b>${r.match}</b>${r.bonusHit ? '<br><small>+보너스</small>' : ''}</td>` +
    `<td>${r.rank >= 0 ? '<span class="w">' + RANKS[r.rank] + '</span>' : '-'}</td></tr>`).join('');
}

// 모든 조 결과: 높은 등수가 많은 조가 위로
function summarize(ws, bonus) {
  return TEAMS.map(t => {
    const rows = check(t.games, ws, bonus);
    const cnt = [0, 0, 0, 0, 0];
    rows.forEach(r => { if (r.rank >= 0) cnt[r.rank]++; });
    return { t, cnt, best: Math.max(...rows.map(r => r.match)) };
  }).sort((a, b) => {
    for (let i = 0; i < 5; i++) if (a.cnt[i] !== b.cnt[i]) return b.cnt[i] - a.cnt[i];
    return a.t.no - b.t.no;
  });
}

function renderAll(ws, bonus) {
  const list = summarize(ws, bonus);
  $('all').innerHTML = list.map(({ t, cnt, best }) =>
    `<tr class="click${t === team ? ' me' : ''}" onclick="selectTeam(${t.no});scrollTo({top:0,behavior:'smooth'})">` +
    `<td>${t.no}조</td>` + cnt.map(c => `<td>${c ? '<span class="w">' + c + '</span>' : '-'}</td>`).join('') +
    `<td>${best}개</td></tr>`).join('');
  $('allBox').style.display = '';
}

// 이 회차에 당첨된 조를 알려주는 팝업
function openPop() {
  const d = draws[current];
  if (!d) return;
  const list = summarize(new Set(d.win), d.bonus);
  const winners = list.filter(x => x.cnt.some(c => c));
  const best = r => r.cnt.findIndex(c => c > 0);
  const chip = x => `<button onclick="selectTeam(${x.t.no});closePop()">${x.t.no}조 ${RANKS[best(x)]} ${x.cnt[best(x)]}게임</button>`;

  let h = `<h3>📢 제${d.ep}회 당첨 소식</h3><div class="sub">${d.date} 추첨</div>`;
  h += '<div>' + d.win.map(n => ball(n)).join('') + ' <b>+</b> ' + ball(d.bonus) + '</div>';
  // 실제로 돈 내고 산 조는 따로 한 줄
  list.filter(x => x.t.name.includes('실제')).sort((a, b) => a.t.no - b.t.no).forEach(x => {
    const b = best(x);
    h += `<div class="real">💵 <b>${teamLabel(x.t)}</b><br>${b >= 0 ? RANKS.map((n, i) => x.cnt[i] ? n + ' ' + x.cnt[i] + '게임' : '').filter(Boolean).join(', ') + ' 당첨!' : '이번엔 당첨 없음'}</div>`;
  });
  if (!winners.length) {
    h += '<p class="line">이번 회차는 당첨된 조가 없어요 😢</p>';
  } else {
    h += `<p class="line">🎉 <b>${winners.length}개 조</b>가 당첨됐어요!</p>`;
    // 1~3등은 크게
    winners.filter(x => best(x) <= 2).forEach(x =>
      h += `<div class="top">🏆 ${x.t.no}조 ${RANKS[best(x)]} ${x.cnt[best(x)]}게임</div>`);
    const fourth = winners.filter(x => best(x) === 3);
    if (fourth.length) h += '<div class="sub">4등 나온 조</div><div class="chips">' + fourth.slice(0, 8).map(chip).join('') +
      (fourth.length > 8 ? `<span class="sub">외 ${fourth.length - 8}개 조</span>` : '') + '</div>';
    const fifth = winners.filter(x => best(x) === 4);
    if (fifth.length) h += `<div class="sub">5등만 나온 조: ${fifth.length}개</div>`;
  }
  h += '<button class="ok" onclick="closePop()">확인</button>';
  $('popCard').innerHTML = h;
  $('pop').style.display = '';
}

function closePop() {
  $('pop').style.display = 'none';
  try { localStorage.setItem('popupSeen', latest); } catch (e) {}
}

// 동행복권 연결이 안 될 때: 번호를 직접 넣어서 확인
function showManual() {
  $('ep').textContent = '직접 입력';
  $('prev').disabled = $('next').disabled = true;
  let inputs = '';
  for (let i = 0; i < 7; i++) inputs += (i === 6 ? ' + ' : '') + '<input type="number" min="1" max="45" inputmode="numeric">';
  $('out').innerHTML = `<div class="box manual"><p class="err">동행복권에서 번호를 가져오지 못했어요.<br>당첨번호 6개와 보너스 번호를 직접 넣어주세요.</p>
    ${inputs}<br><button id="manualGo">확인하기</button></div><div id="manualOut"></div>`;
  $('manualGo').onclick = () => {
    const v = [...document.querySelectorAll('.manual input')].map(i => +i.value);
    if (v.some(n => !(n >= 1 && n <= 45)) || new Set(v).size !== 7) { alert('1~45 사이의 서로 다른 번호 7개를 넣어주세요.'); return; }
    manual = { win: v.slice(0, 6), bonus: v[6] };
    $('balls').innerHTML = manual.win.map(n => ball(n)).join('') + ' <b>+</b> ' + ball(manual.bonus);
    render(manual.win, manual.bonus, 'manualOut');
  };
}

$('newsBtn').onclick = openPop;
$('prev').onclick = () => show(current - 1);
$('next').onclick = () => show(current + 1);
start();
</script>
</body>
</html>
