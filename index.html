<script>
// 우리 번호가 처음 적용된 회차 (2026-09-05 추첨, 제1240회)
const FIRST_EP = 1240;
const API = 'https://www.dhlottery.co.kr/lt645/selectPstLt645InfoNew.do?srchDir=center&srchLtEpsd=';
const RANKS = ['1등', '2등', '3등', '4등', '5등'];

const GAMES = document.getElementById('combos').textContent.trim().split('\n')
  .map(l => l.trim()).filter(l => l && !l.startsWith('#'))
  .map(l => { const p = l.split(/\s+/); return { id: p[0], nums: p.slice(1, 7).map(Number) }; });

const $ = id => document.getElementById(id);
let draws = {};      // 회차 → {ep, date, win[6], bonus}
let latest = 0, current = 0;

// 지금 시각 기준으로 가장 최근에 추첨했을 회차 (제1회 = 2002-12-07)
function expectedEpisode() {
  const first = Date.UTC(2002, 11, 7, 12, 0);  // 2002-12-07 21:00 KST
  return Math.floor((Date.now() - first) / (7 * 864e5)) + 1;
}

async function load(ep) {
  const res = await fetch(API + ep);
  const json = await res.json();
  for (const d of json.data.list) {
    draws[d.ltEpsd] = {
      ep: d.ltEpsd,
      date: d.ltRflYmd.replace(/(\d{4})(\d\d)(\d\d)/, '$1.$2.$3'),
      win: [d.tm1WnNo, d.tm2WnNo, d.tm3WnNo, d.tm4WnNo, d.tm5WnNo, d.tm6WnNo],
      bonus: d.bnsWnNo,
    };
  }
  return json.data.list.length;
}

async function start() {
  try {
    let ep = expectedEpisode();
    if (!(await load(ep))) await load(ep - 1);   // 결과가 아직 안 올라왔으면 지난주
    latest = Math.max(...Object.keys(draws).map(Number));
    if (!isFinite(latest)) throw new Error('empty');
    show(latest);
  } catch (e) {
    showManual();
  }
}

async function show(ep) {
  current = ep;
  if (!draws[ep]) { try { await load(ep); } catch (e) {} }
  const d = draws[ep];
  $('prev').disabled = ep <= FIRST_EP;
  $('next').disabled = ep >= latest;
  if (!d) { $('ep').textContent = '제' + ep + '회'; $('out').innerHTML = '<p class="msg err">이 회차를 불러오지 못했어요.</p>'; return; }
  $('ep').innerHTML = `제${d.ep}회 <small>${d.date} 추첨${ep === latest ? ' · 최신' : ''}</small>`;
  $('balls').innerHTML = d.win.map(n => ball(n)).join('') + ' <b>+</b> ' + ball(d.bonus);
  render(d.win, d.bonus);
}

function color(n) { return n <= 10 ? 'y' : n <= 20 ? 'b' : n <= 30 ? 'r' : n <= 40 ? 'g' : 'gr'; }
function ball(n, cls) { return `<span class="ball ${cls || color(n)}">${n}</span>`; }

function render(win, bonus, target = 'out') {
  const ws = new Set(win);
  const rows = GAMES.map(g => {
    const match = g.nums.filter(n => ws.has(n)).length;
    const bonusHit = g.nums.includes(bonus);
    const rank = match === 6 ? 0 : match === 5 && bonusHit ? 1 : match === 5 ? 2 : match === 4 ? 3 : match === 3 ? 4 : -1;
    return { ...g, match, bonusHit, rank };
  }).sort((a, b) => b.match - a.match || b.bonusHit - a.bonusHit);

  const cnt = [0, 0, 0, 0, 0];
  rows.forEach(r => { if (r.rank >= 0) cnt[r.rank]++; });
  const wins = rows.filter(r => r.rank >= 0);
  const best = rows[0].match;

  let html = '';
  if (wins.length) {
    const top = cnt.findIndex(c => c > 0);
    html += `<div class="big win">🎉 축하합니다! ${RANKS[top]} 당첨!<small>${GAMES.length}게임 중 ${wins.length}게임 당첨</small></div>`;
  } else {
    html += `<div class="big lose">아쉽게도 이번엔 당첨이 없어요<small>가장 많이 맞은 게임: ${best}개</small></div>`;
  }
  html += '<div class="box"><div class="ranks">' +
    RANKS.map((n, i) => `<div class="${cnt[i] ? 'on' : ''}">${n}<b>${cnt[i]}</b></div>`).join('') + '</div></div>';

  html += '<div class="box"><table><tr><th>번호</th><th>우리 번호</th><th>맞음</th><th>결과</th></tr>';
  html += rowsHtml(rows.filter(r => r.match >= 3), ws, bonus);
  html += '<tbody id="rest" style="display:none">' + rowsHtml(rows.filter(r => r.match < 3), ws, bonus) + '</tbody>';
  html += '</table>';
  if (!rows.some(r => r.match >= 3)) html += '<p class="msg">3개 이상 맞은 게임이 없어요.</p>';
  html += `<button class="more" onclick="document.getElementById('rest').style.display='';this.remove()">나머지 게임도 모두 보기</button></div>`;
  $(target).innerHTML = html;
}

function rowsHtml(list, ws, bonus) {
  return list.map(r => `<tr><td>${r.id}</td><td>` +
    r.nums.map(n => ws.has(n) ? ball(n) : n === bonus ? ball(n, color(n) + ' bon') : ball(n, 'dim')).join('') +
    `</td><td><b>${r.match}</b>${r.bonusHit ? '<br><small>+보너스</small>' : ''}</td>` +
    `<td>${r.rank >= 0 ? '<b style="color:#166534">' + RANKS[r.rank] + '</b>' : '-'}</td></tr>`).join('');
}

// 동행복권 연결이 안 될 때: 번호를 직접 넣어서 확인
function showManual() {
  $('ep').textContent = '직접 입력';
  $('prev').disabled = $('next').disabled = true;
  let inputs = '';
  for (let i = 0; i < 7; i++) inputs += (i === 6 ? ' + ' : '') + '<input type="number" min="1" max="45" inputmode="numeric">';
  $('out').innerHTML = `<div class="box manual"><p class="err">동행복권에서 번호를 가져오지 못했어요.<br>당첨번호 6개와 보너스 번호를 직접 넣어주세요.</p>
    ${inputs}<br><button id="manualGo">확인하기</button></div><div id="manualOut"></div>`;
  $('manualGo').onclick = () => {
    const v = [...document.querySelectorAll('.manual input')].map(i => +i.value);
    if (v.some(n => !(n >= 1 && n <= 45)) || new Set(v).size !== 7) { alert('1~45 사이의 서로 다른 번호 7개를 넣어주세요.'); return; }
    $('balls').innerHTML = v.slice(0, 6).map(n => ball(n)).join('') + ' <b>+</b> ' + ball(v[6]);
    render(v.slice(0, 6), v[6], 'manualOut');
  };
}

$('prev').onclick = () => show(current - 1);
$('next').onclick = () => show(current + 1);
start();
</script>
</body>
